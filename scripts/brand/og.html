<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Social share card (1200×630). Rendered to public/opengraph-image.png by
         scripts/render-brand-assets.mjs; edit here, then rerun the script. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; padding: 72px 80px;
        display: flex; align-items: center; gap: 72px;
        background: radial-gradient(ellipse at 20% 30%, #0b1a13 0%, #050807 60%);
        font-family: 'JetBrains Mono', monospace;
      }
      img { width: 380px; filter: drop-shadow(0 0 32px rgba(94, 242, 166, 0.25)); }
      .name { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 104px; line-height: 0.95; letter-spacing: 0.12em; }
      .first { color: #f4f4f5; }
      .last { color: #5ef2a6; text-shadow: 0 0 24px rgba(94, 242, 166, 0.35); }
      .tagline { margin-top: 28px; font-size: 22px; letter-spacing: 0.35em; color: #a1a1aa; }
      .role { margin-top: 36px; font-size: 26px; color: #e4e4e7; }
    </style>
  </head>
  <body>
    <img src="mark.svg" alt="" />
    <div>
      <div class="name"><div class="first">BRUNO</div><div class="last">PEDROSO</div></div>
      <div class="tagline">BACKEND · SECURITY · AI</div>
      <div class="role">Senior Software Engineer · Tech Lead</div>
    </div>
  </body>
</html>
